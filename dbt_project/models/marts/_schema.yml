version: 2

models:
  - name: mart_lcr
    description: "Static LCR per scenario."
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]
      - name: hqla
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, inclusive: true }
      - name: lcr
        data_tests: [not_null]

  - name: mart_lcr_daily
    columns:
      - name: scenario_id
        data_tests: [not_null]
      - name: as_of_date
        data_tests: [not_null]

  - name: mart_nsfr
    description: "Static NSFR per scenario."
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]
      - name: nsfr
        data_tests: [not_null]

  - name: mart_nsfr_components
    columns:
      - name: side
        data_tests:
          - accepted_values: { values: ["ASF", "RSF"] }

  - name: mart_nsfr_daily

  - name: mart_capital_ratios
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]

  - name: mart_capital_ratios_daily

  - name: mart_rwa_breakdown
    columns:
      - name: approach
        data_tests:
          - accepted_values: { values: ["STD", "IRB"] }
      - name: asset_class
        data_tests:
          - accepted_values: { values: ["mortgage", "corporate", "sovereign", "retail"] }

  - name: mart_pv01_profile
    columns:
      - name: tenor_bucket
        data_tests:
          - accepted_values: { values: ["0-1y", "1-3y", "3-5y", "5-10y", "10y+"] }

  - name: mart_repricing_gap
    columns:
      - name: tenor_bucket
        data_tests:
          - accepted_values: { values: ["0-1y", "1-3y", "3-5y", "5-10y", "10y+"] }

  - name: mart_cashflow_gap
    columns:
      - name: maturity_day_bucket
        data_tests:
          - accepted_values: { values: ["0-7d", "8-30d", "31-90d", "91-180d", "181-365d", ">1y"] }

  - name: mart_eve_bcbs368
    columns:
      - name: shock_scenario
        data_tests:
          - accepted_values:
              values: ["Parallel up", "Parallel down", "Short rate up", "Short rate down", "Steepener", "Flattener"]

  - name: mart_eve_supervisory
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]
      - name: ratio
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, inclusive: true }

  - name: mart_eve_distribution_stats
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]

  - name: mart_nii_horizon_stats
    columns:
      - name: horizon_months
        data_tests:
          - accepted_values: { values: [12, 24, 36] }

  - name: mart_model_metadata
    description: "Risk-engine run metadata surfaced to the dashboard (model family, params JSON, calibration + MC settings, curve-fit residual)."
    columns:
      - name: model_family
        data_tests:
          - accepted_values: { values: ["hull_white_1f", "vasicek_1f"] }

  - name: mart_ftp_curve
    description: "Internal FTP curve snapshot: base wholesale yield + LP add-on per tenor."
    columns:
      - name: tenor_years
        data_tests: [unique, not_null]
      - name: ftp_yield
        data_tests: [not_null]

  - name: mart_nii_attribution
    description: "Book-level NII decomposition per scenario under matched-funded FTP."
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]

  - name: mart_nii_attribution_by_product
    description: "Product × scenario NII attribution."
    columns:
      - name: product
        data_tests:
          - accepted_values: { values: ["loan", "deposit", "bond"] }

  - name: mart_mortgage_cf
    description: "Per-mortgage CPR-adjusted valuation summary at the base curve."
    columns:
      - name: cashflow_id
        data_tests: [not_null]
      - name: avg_cpr
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 1, inclusive: true }
      - name: weighted_avg_life_years
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, inclusive: true }

  - name: mart_callable_bonds
    description: "Per-callable-bond Black-76 decomposition; callable_pv = straight_pv - call_value."
    columns:
      - name: cashflow_id
        data_tests: [not_null]
      - name: call_value
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, inclusive: true }
      - name: call_value_pct_of_straight
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 1, inclusive: true }

  - name: mart_optionality_summary
    description: "Per-scenario book-level optionality summary (mortgage CPR + callable Black-76 totals)."
    columns:
      - name: scenario_id
        data_tests: [unique, not_null]

  - name: mart_survival_horizon
    description: "ALMM-style survival horizon per (scenario, stress) — first day cumulative net outflows exhaust counterbalancing capacity."
    columns:
      - name: scenario_id
        data_tests: [not_null]
      - name: stress_name
        data_tests:
          - accepted_values: { values: ["idiosyncratic", "market_wide", "combined"] }
      - name: survival_horizon_days
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 365, inclusive: true }
      - name: severity_bucket
        data_tests:
          - accepted_values: { values: ["survives horizon", "critical (<= 1w)", "severe (<= 1m)", "moderate (<= 3m)", "long (> 3m)"] }

  - name: mart_cbc_ladder
    description: "Daily counterbalancing-capacity trajectory per (scenario, stress) for the survival-horizon plot."
    columns:
      - name: stress_name
        data_tests:
          - accepted_values: { values: ["idiosyncratic", "market_wide", "combined"] }
      - name: day_offset
        data_tests:
          - dbt_utils.accepted_range: { min_value: 0, max_value: 365, inclusive: true }
