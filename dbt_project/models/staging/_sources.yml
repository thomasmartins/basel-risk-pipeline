version: 2

sources:
  - name: raw
    description: "Raw tables loaded by basel_ingestion.load from data/raw/*.parquet"
    schema: main
    tables:
      - name: scenarios
        description: "Stress scenarios. id=1 Baseline, 2 ECB Stress, 3 Liquidity Shock, 4 IR Shock."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
      - name: cashflows
        description: "Per-instrument cashflows with HQLA tier, ASF/RSF factors, direction."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: direction
            data_tests:
              - accepted_values:
                  values: ["inflow", "outflow"]
          - name: hqlatype
            data_tests:
              - accepted_values:
                  values: ["Level1", "Level2A", "Level2B", "None"]
          - name: scenario_id
            data_tests:
              - relationships:
                  to: source('raw', 'scenarios')
                  field: id
      - name: balance_sheet
        description: "Capital stack and balance sheet items by date and scenario."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: item
            data_tests:
              - accepted_values:
                  values: ["CET1", "Tier1", "Total Capital", "Total Assets", "Total Liabilities"]
      - name: rwa
        description: "Risk-weighted assets by exposure, approach (STD/IRB), asset class."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: approach
            data_tests:
              - accepted_values:
                  values: ["STD", "IRB"]
          - name: asset_class
            data_tests:
              - accepted_values:
                  values: ["mortgage", "corporate", "sovereign", "retail"]
      - name: irrbb
        description: "IRRBB instrument-level cashflows with PV01 by tenor bucket."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: tenor_bucket
            data_tests:
              - accepted_values:
                  values: ["0-1y", "1-3y", "3-5y", "5-10y", "10y+"]
      - name: params
        description: "Configuration parameters (haircuts, caps, thresholds)."
        columns:
          - name: key
            data_tests:
              - unique
              - not_null
