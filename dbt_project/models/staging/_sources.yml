version: 2

sources:
  - name: raw
    description: "Raw tables loaded by basel_ingestion.load from data/raw/*.parquet"
    schema: main
    tables:
      - name: scenarios
        description: "Stress scenarios. id=1 Baseline, 2 ECB Stress, 3 Liquidity Shock, 4 IR Shock."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: name
            data_tests:
              - not_null
      - name: cashflows
        description: "Per-instrument cashflows with HQLA tier, ASF/RSF factors, direction, and Phase 2.1c optionality (amortisation type, callable terms)."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: direction
            data_tests:
              - accepted_values:
                  values: ["inflow", "outflow"]
          - name: hqlatype
            data_tests:
              - accepted_values:
                  values: ["Level1", "Level2A", "Level2B", "None"]
          - name: amortization_type
            description: "bullet = single-payment at maturity; level = level-payment mortgage with explicit term_months."
            data_tests:
              - accepted_values:
                  values: ["bullet", "level"]
          - name: is_callable
            data_tests:
              - not_null
          - name: scenario_id
            data_tests:
              - relationships:
                  to: source('raw', 'scenarios')
                  field: id
      - name: balance_sheet
        description: "Capital stack and balance sheet items by date and scenario."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: item
            data_tests:
              - accepted_values:
                  values: ["CET1", "Tier1", "Total Capital", "Total Assets", "Total Liabilities"]
      - name: rwa
        description: "Risk-weighted assets by exposure, approach (STD/IRB), asset class."
        columns:
          - name: id
            data_tests:
              - unique
              - not_null
          - name: approach
            data_tests:
              - accepted_values:
                  values: ["STD", "IRB"]
          - name: asset_class
            data_tests:
              - accepted_values:
                  values: ["mortgage", "corporate", "sovereign", "retail"]
      - name: params
        description: "Configuration parameters (haircuts, caps, thresholds)."
        columns:
          - name: key
            data_tests:
              - unique
              - not_null
      - name: liquidity_premium
        description: "Per-tenor FTP liquidity-premium add-on, in basis points."
        columns:
          - name: tenor_years
            data_tests:
              - unique
              - not_null
          - name: lp_bps
            data_tests:
              - not_null
